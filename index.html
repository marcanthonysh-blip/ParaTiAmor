<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Para Ti Mi Amor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Dancing+Script:wght@600&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="inicio">
      <div class="fondo" aria-hidden="true">
        <span class="orbe girasol"></span>
        <span class="orbe rosa"></span>
        <span class="orbe lirio"></span>
      </div>

      <div class="vidrio">
        <img
          class="ramo"
          src="https://media.tenor.com/f7ZjPd6L80wAAAAi/christmas-gift-giving.gif"
          alt="Ramo de girasoles, lirio y rosa"
        />
        <h1>Feliz Día Mi Princesa</h1>
        <p>Este detalle es para ti, porque mereces recibir todo el cariño que llevo en mi corazón. 💘</p>
        <button id="btnEntrar" type="button">Ver sorpresa</button>
      </div>

      <div class="firma">Con todo mi amor ❤️</div>
    </div>

    <div id="videoContainer">
      <video id="miVideo" autoplay muted loop playsinline>
        <source
          src="MiAmor.mp4"
          type="video/mp4"
        />
      </video>
    </div>

    <script src="script.js"></script>
  </body>
</html>
